r:#819080;font-size:12px;margin-bottom:26px}.formgrid{display:grid;gap:23px}label{display:grid;gap:9px;font-size:13px;color:#6e7c70}.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}.people button.chosen{background:#294e40;color:white;border-color:#294e40}.amount{display:grid;grid-template-columns:minmax(0,1fr) 105px;gap:8px}.tiny{font-size:12px;min-height:32px;padding:5px 0;background:transparent;border:0;text-align:left;color:#6d806c}.filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px}.filters>*{flex:1;min-width:130px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:16px 12px;text-align:left;border-bottom:1px solid #e7ebe3;white-space:nowrap}th{font-size:11px;color:#83907e;font-weight:500}td small{display:block;color:#83907e;margin-top:5px}td button{font-size:12px;min-height:36px;padding:7px 11px}.tag{font-size:11px;padding:4px 8px;border-radius:7px;background:#e3eedc}.tag.out{background:#f0e1d1}.empty{text-align:center;padding:35px;color:#819080;font-size:14px}.notice{padding:14px 18px;background:#f1e6ce;border-radius:13px;margin-bottom:20px;font-size:14px}nav{display:flex;gap:5px}nav button{border:0;background:transparent;font-size:13px;min-height:44px;padding:10px 15px}nav .active{background:#e3eada}.back{background:transparent;border:0;padding:8px 0;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.status{font-size:11px;color:#7c8c7c}.settingsgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.error{font-size:13px;color:#a2553b}.success{font-size:13px;color:#3b714e}dialog{width:min(480px,94vw);border:0;border-radius:22px;padding:26px;max-height:90dvh;overflow:auto}dialog::backdrop{background:#18392f66}.hide,[hidden]{display:none!important}.muted{font-size:12px;color:#819080;line-height:1.6}.settingsgrid label{font-size:12px}@media(max-width:600px){header{padding:17px 18px;align-items:flex-start;gap:14px;flex-wrap:wrap}.brand{font-size:18px}nav{width:100%;justify-content:space-between}nav button{flex:1;padding:10px 7px}main{padding:18px 18px 60px}.hero{padding:35px 0}.total{font-size:53px}.actions{gap:12px;margin:32px 0}.actions button{min-height:118px}.card{padding:21px 17px;border-radius:19px}.periodTotal{font-size:37px}.settingsgrid{grid-template-columns:1fr}header small{font-size:10px}.filters{display:grid;grid-template-columns:1fr 1fr}.filters>*{min-width:0}.tablewrap{margin:0 -12px}.total span{font:14px system-ui;letter-spacing:1px;display:block;margin-top:12px}}
nav{flex-wrap:wrap}.list-add{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:10px;margin-bottom:18px}.list-add .primary{font-size:25px;letter-spacing:0;padding:0}.list-meta{display:flex;justify-content:space-between;font-size:12px;color:#819080;margin-bottom:15px}.check-row{display:flex;align-items:center;gap:13px;background:white;border:1px solid #e0e5dc;border-radius:14px;padding:13px;margin:9px 0;min-height:62px;cursor:pointer;color:#263d36;font-size:16px}.check-row input{flex:0 0 24px;width:24px;height:24px;min-height:24px;margin:0;accent-color:#294e40}.check-row span{overflow-wrap:anywhere;min-width:0;line-height:1.5}.check-row.checked{background:#edf0e7;color:#859080}.check-row.checked span{text-decoration:line-through}.done-title{font:13px system-ui;color:#819080;margin:28px 0 12px}@media(max-width:600px){nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}nav button{white-space:nowrap;padding:10px 5px;font-size:12px}}
</style><header><div class="brand">Family Finance Life<small>Chechu & Vahan</small></div><nav><button onclick="go('balance')" data-page="balance">Balance</button><button onclick="go('transactions')" data-page="transactions">Transactions</button><button onclick="go('market')" data-page="market">MARKET</button><button onclick="go('todo')" data-page="todo">TO DO</button><button onclick="go('settings')" data-page="settings">Settings</button></nav></header><main><div id="notice" class="notice" hidden role="status"></div><div id="content"><div class="empty">Loading…</div></div></main><dialog id="dialog"><div class="row"><h2 id="dialogtitle"></h2><button onclick="dialog.close()" aria-label="Close">×</button></div><div id="dialogbody"></div></dialog><script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.js"></script><script src="./auth.js"></script><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data,market,version,page='balance',busy=false,person='',filterMonth='',filterCategory='',filterPlace='',filterType='';
const categories=[['🚗','Car things'],['⛽','LPG / Benzine'],['🛒','Supermarket'],['☕','Coffee & Food Out'],['🏠','House communal'],['🌱','Learn & Grow'],['👕','Clothes'],['🛋️','HouseThings'],['✳️','Others']];const places=['Cash','N26','InecoBank'];
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Yerevan',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}let entryMonth=today().slice(0,7);
function money(n,c='AMD'){return Number.isFinite(n)?new Intl.NumberFormat('en-US',{style:'currency',currency:c,maximumFractionDigits:c==='AMD'?0:2}).format(n):'Rate unavailable'}
function locationOf(a){return a.location||({eur:'N26',amd:'InecoBank',cashamd:'Cash',usd:'Cash'}[a.id])||'Cash'}
function normalize(d){for(const a of d.accounts)a.location=locationOf(a);return d}
function account(id){return data.accounts.find(a=>a.id===id)}function balance(a){return data.transactions.reduce((s,t)=>s+(t.account===a.id?(t.type==='income'?t.amount:-t.amount):0)+(t.type==='transfer'&&t.to===a.id?t.received:0),a.opening)}
function amd(t){return account(t.account).currency==='AMD'?t.amount:t.amount*Number(t.fx?.rates?.[account(t.account).currency])}
function totalAmd(){return data.accounts.reduce((s,a)=>s+balance(a)*Number(market?.rates?.[a.currency]),0)}
function cats(){return [...categories,...(data.categories||[]).map(c=>['✳️',c])]}function catOptions(selected=''){return cats().map(([icon,c])=>`<option value="${esc(c)}" ${selected===c?'selected':''}>${icon} ${esc(c)}</option>`).join('')}
function options(values,selected='',blank='Choose…'){return `<option value="">${blank}</option>`+values.map(v=>`<option ${v===selected?'selected':''} value="${esc(v)}">${esc(v)}</option>`).join('')}
function notice(s){$('#notice').hidden=!s;$('#notice').textContent=s}
async function load(){try{const r=await FamilyAuth.request('/api/state');const s=await r.json();if(!r.ok)throw Error(s.error);data=normalize(s.data);version=s.version;market=s.market;notice(s.rateError||'');render()}catch(e){notice(e.message||'Unable to load. Please reload.')}}
async function save(next){if(busy)return false;busy=true;try{const r=await FamilyAuth.request('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:next,version})});let s;try{s=await r.json()}catch{throw Error('Unable to save. Please retry.')}if(!r.ok)throw Error(s.error||'Unable to save');data=normalize(s.data);version=s.version;notice('');return true}catch(e){notice(e.message);return false}finally{busy=false}}
function go(p){page=p;person='';entryMonth=today().slice(0,7);render();if(['market','todo'].includes(page))refreshChecklist();window.scrollTo(0,0)}
function render(){if(!data)return;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='balance')home();else if(page==='income'||page==='expense')entry();else if(page==='transactions')transactions();else if(page==='market'||page==='todo')checklist();else settings()}
function home(){const total=totalAmd();$('#content').innerHTML=`<section class="hero"><h1>BALANCE</h1><div class="total">${money(total/Number(market?.rates?.USD),'USD')}<span> USD</span></div><div class="reference">${money(total)} </div><div class="actions"><button class="in" onclick="go('income')">↙ &nbsp; IN</button><button class="out" onclick="go('expense')">↗ &nbsp; OUT</button></div></section>`}
function entry(){const out=page==='expense',past=entryMonth!==today().slice(0,7),sum=data.transactions.filter(t=>t.type===page&&t.date.startsWith(entryMonth)).reduce((s,t)=>s+amd(t),0);$('#content').innerHTML=`<div class="entry"><button class="back" onclick="go('balance')">← Balance</button><h1>${out?'OUT':'IN'}</h1><input class="period" id="entryMonth" aria-label="Month" type="month" value="${entryMonth}" max="${today().slice(0,7)}"><div class="periodTotal">${money(sum)}</div><div class="sub">${out?'Spent this month':'Income this month'}</div>${past&&out?'<div class="empty">Viewing history</div>':`<form id="entryform" class="card formgrid">${past?`<label>Date<input name="date" type="date" value="${entryMonth}-01" min="${entryMonth}-01" max="${entryMonth}-${new Date(Number(entryMonth.slice(0,4)),Number(entryMonth.slice(5)),0).getDate()}" required></label>`:""}<div><label>Who</label><div class="people"><button type="button" data-person="Chechu" onclick="choosePerson('Chechu')">Chechu</button><button type="button" data-person="Vahan" onclick="choosePerson('Vahan')">Vahan</button></div></div>${out?`<label>In what we spend<select name="category" required><option value="">Choose category…</option>${catOptions()}</select><input name="details" placeholder="Specify what" aria-label="Specify what"><button class="tiny" type="button" onclick="addCategory()">+ add category</button></label>`:'<label>From where<input name="source" placeholder="Project or income source" maxlength="180" required></label>'}<label>Amount<div class="amount"><input name="amount" aria-label="Amount" type="number" inputmode="decimal" min="0.01" step="0.01" required><select name="currency" aria-label="Currency"><option value="AMD">Drams</option><option value="USD">USD</option><option value="EUR">EUR</option></select></div></label><label>${out?'From where':'Where'}<select name="place" required>${options(places)}</select></label><p id="entryerror" class="error" role="alert" hidden></p><button class="primary" id="add" disabled>ADD</button></form>`}</div>`;$('#entryMonth').onchange=e=>{if(e.target.value){entryMonth=e.target.value;person='';entry()}};if(past&&out)return;const f=$('#entryform');f.oninput=validateEntry;f.onchange=()=>{const isOther=f.elements.category?.value==='Others';if(f.elements.details)f.elements.details.required=isOther;validateEntry()};f.onsubmit=async e=>{e.preventDefault();if(!person||busy)return;const values=Object.fromEntries(new FormData(f));const n=structuredClone(data),a=ensureAccount(n,values.place,values.currency);const item={id:crypto.randomUUID(),date:values.date||today(),type:page,person,account:a.id,amount:Number(values.amount),category:out?values.category:'Income',note:out?values.details.trim():values.source.trim(),source:out?'':values.source.trim(),location:values.place,expenseKind:out?'Variable':''};if(!Number.isFinite(item.amount)||item.amount<=0)return;$('#add').disabled=true;$('#add').textContent='SAVING…';n.transactions.push(item);if(await save(n)){person='';entry();notice('Added')}else{$('#add').textContent='ADD';validateEntry()}};}
function choosePerson(p){person=p;document.querySelectorAll('[data-person]').forEach(b=>b.classList.toggle('chosen',b.dataset.person===p));validateEntry()}
function validateEntry(){const f=$('#entryform');if(!f)return;$('#add').disabled=busy||!person||!f.checkValidity()||!(f.elements.source?.value.trim()||f.elements.category?.value);}
function ensureAccount(d,place,currency){let a=d.accounts.find(a=>locationOf(a)===place&&a.currency===currency);if(!a){a={id:crypto.randomUUID(),name:place+' · '+currency,currency,opening:0,location:place};d.accounts.push(a)}return a}
function addCategory(){const f=$('#entryform'),draft=Object.fromEntries(new FormData(f)),p=person;$('#dialogtitle').textContent='Add category';$('#dialogbody').innerHTML='<form id="categoryform" class="formgrid"><label>Category name<input name="name" maxlength="60" required></label><button class="primary">ADD CATEGORY</button></form>';$('#categoryform').onsubmit=async e=>{e.preventDefault();const name=new FormData(e.target).get('name').trim();if(!name)return;if(cats().some(x=>x[1].toLowerCase()===name.toLowerCase()))return;const n=structuredClone(data);n.categories=[...(n.categories||[]),name];e.submitter.disabled=true;if(await save(n)){dialog.close();entry();person=p;for(const [key,value]of Object.entries(draft))if($('#entryform').elements[key])$('#entryform').elements[key].value=value;$('#entryform').elements.category.value=name;choosePerson(p)}else e.submitter.disabled=false};dialog.showModal()}
function transactions(){const categoryNames=[...new Set([...cats().map(c=>c[1]),...data.transactions.filter(t=>t.type==='expense').map(t=>t.category)])];const ts=data.transactions.filter(t=>(!filterMonth||t.date.startsWith(filterMonth))&&(!filterCategory||t.category===filterCategory)&&(!filterPlace||locationOf(account(t.account))===filterPlace)&&(!filterType||t.type===filterType)).sort((a,b)=>b.date.localeCompare(a.date));$('#content').innerHTML=`<h1>TRANSACTIONS</h1><div class="filters"><input id="txmonth" type="month" aria-label="Filter month" value="${filterMonth}"><select id="txcategory" aria-label="Filter category">${options(categoryNames,filterCategory,'All categories')}</select><select id="txplace" aria-label="Filter payment method">${options(places,filterPlace,'All payment methods')}</select><select id="txtype" aria-label="Filter type"><option value="">IN & OUT & Transfers</option><option value="income" ${filterType==='income'?'selected':''}>IN</option><option value="expense" ${filterType==='expense'?'selected':''}>OUT</option><option value="transfer" ${filterType==='transfer'?'selected':''}>Transfer</option></select></div><div class="card tablewrap"><table><thead><tr><th>Date</th><th>Type</th><th>Who</th><th>From / Category</th><th>Details</th><th>Amount</th><th>Where</th><th>In drams</th><th></th></tr></thead><tbody>${ts.map(t=>`<tr><td>${esc(t.date)}</td><td><span class="tag ${t.type==='expense'?'out':''}">${t.type==='income'?'IN':t.type==='expense'?'OUT':'TRANSFER'}</span></td><td>${esc(t.person)}</td><td>${esc(t.type==='income'?t.source||t.note:t.category||'Exchange')}</td><td>${esc(t.type==='income'?'':t.note)}</td><td>${money(t.amount,account(t.account).currency)}${t.type==='transfer'?'<small>→ '+money(t.received,account(t.to).currency)+'</small>':''}</td><td>${esc(locationOf(account(t.account)))}${t.type==='transfer'?' → '+esc(locationOf(account(t.to))):''}<small>${account(t.account).currency}</small></td><td>${t.type==='transfer'?'—':money(amd(t))}</td><td><button onclick="editMovement('${t.id}')">Edit</button></td></tr>`).join('')}</tbody></table>${ts.length?'':'<div class="empty">No transactions</div>'}</div>`;$('#txmonth').onchange=e=>{filterMonth=e.target.value;transactions()};$('#txcategory').onchange=e=>{filterCategory=e.target.value;transactions()};$('#txplace').onchange=e=>{filterPlace=e.target.value;transactions()};$('#txtype').onchange=e=>{filterType=e.target.value;transactions()}}
function editMovement(id){const t=data.transactions.find(t=>t.id===id);$('#dialogtitle').textContent='Edit transaction';$('#dialogbody').innerHTML=`<form id="editform" class="formgrid"><label>Date<input type="date" name="date" min="${data.startDate}" max="${today()}" value="${esc(t.date)}" required></label><label>Who<select name="person">${options(['Chechu','Vahan'],t.person)}</select></label><label>Amount · ${account(t.account).currency}<input name="amount" type="number" min="0.01" step="0.01" value="${t.amount}" required></label>${t.type==='transfer'?`<label>Received · ${account(t.to).currency}<input name="received" type="number" min="0.01" step="0.01" value="${t.received}" required></label>`:''}${t.type==='expense'?`<label>Category<select name="category">${options([...new Set([...cats().map(c=>c[1]),t.category])],t.category)}</select></label>`:''}<label>${t.type==='income'?'From where':'Details'}<input name="note" value="${esc(t.note)}" ${t.type==='income'?'required':''}></label><button class="primary">SAVE</button></form>`;$('#editform').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),n=structuredClone(data),item=n.transactions.find(t=>t.id===id);Object.assign(item,f,{amount:Number(f.amount)});if(t.type==='income')item.source=f.note;if(t.type==='transfer')item.received=Number(f.received);e.submitter.disabled=true;if(await save(n)){dialog.close();transactions()}else e.submitter.disabled=false};dialog.showModal()}
function settings(){$('#content').innerHTML=`<h1>SETTINGS</h1><div class="card"><h2>Starting balances</h2><form id="settingsform" class="formgrid"><div class="settingsgrid">${data.accounts.map(a=>`<label>${esc(locationOf(a))} · ${a.currency}<input name="${a.id}" type="number" step="0.01" min="0" value="${a.opening}" required></label>`).join('')}</div><button class="primary">SAVE</button></form></div><div class="row"><button onclick="transfer()">Transfer / Exchange</button><button onclick="load()">Refresh</button></div>`;$('#settingsform').onsubmit=async e=>{e.preventDefault();let n=structuredClone(data),f=new FormData(e.target);n.accounts.forEach(a=>a.opening=Number(f.get(a.id)));e.submitter.disabled=true;if(await save(n)){settings();notice('Saved')}else e.submitter.disabled=false}}
function transfer(){$('#dialogtitle').textContent='Transfer / Exchange';$('#dialogbody').innerHTML=`<form id="transferform" class="formgrid"><label>Who<select name="person" required>${options(['Chechu','Vahan'])}</select></label><label>From<select name="from" required>${options(places)}</select></label><div class="amount"><input name="amount" aria-label="Amount sent" type="number" min="0.01" step="0.01" placeholder="Amount sent" required><select name="currency">${options(['AMD','USD','EUR'],'USD')}</select></div><label>To<select name="to" required>${options(places)}</select></label><div class="amount"><input name="received" aria-label="Amount received" type="number" min="0.01" step="0.01" placeholder="Received" required><select name="toCurrency">${options(['AMD','USD','EUR'],'AMD')}</select></div><p class="muted">Moves existing money. Not income or spending.</p><p id="transfererror" class="error"></p><button class="primary">MOVE</button></form>`;$('#transferform').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),n=structuredClone(data),from=ensureAccount(n,f.from,f.currency),to=ensureAccount(n,f.to,f.toCurrency);if(from.id===to.id||f.currency===f.toCurrency&&Number(f.amount)!==Number(f.received)){$('#transfererror').textContent='Choose different accounts. Same-currency amounts must match.';return}n.transactions.push({id:crypto.randomUUID(),type:'transfer',person:f.person,date:today(),account:from.id,to:to.id,amount:Number(f.amount),received:Number(f.received),note:'Exchange / transfer'});e.submitter.disabled=true;if(await save(n)){dialog.close();settings();notice('Moved')}else e.submitter.disabled=false};dialog.showModal()}

function checklistKey(){return page==='market'?'market':'todo'}
function checklistItems(key){return Array.isArray(data.lists?.[key])?data.lists[key]:[]}
function checklist(){const key=checklistKey(),marketList=key==='market';$('#content').innerHTML=`<div class="entry"><h1>${marketList?'MARKET':'TO DO'}</h1><form id="listform" class="list-add"><input id="listinput" aria-label="${marketList?'New shopping item':'New task'}" maxlength="200" autocomplete="off" placeholder="${marketList?'What do we need?':'What needs doing?'}" required><button type="submit" class="primary" aria-label="Add item">＋</button></form><div class="list-meta"><span id="listcount"></span><span id="listsync" role="status"></span></div><div id="listitems"></div></div>`;renderChecklistItems();$('#listform').onsubmit=async e=>{e.preventDefault();const text=$('#listinput').value.trim();if(!text||busy)return;const item={id:crypto.randomUUID(),text,done:false,createdAt:new Date().toISOString()};const success=await changeChecklist(key,items=>{if(!items.some(i=>i.id===item.id))items.push(item)});if(success&&page===key){$('#listinput').value='';$('#listinput').focus()}}}
function renderChecklistItems(){if(!$('#listitems'))return;const key=checklistKey(),items=checklistItems(key),pending=items.filter(i=>!i.done),done=items.filter(i=>i.done);$('#listcount').textContent=pending.length+' left';const row=i=>`<label class="check-row ${i.done?'checked':''}"><input type="checkbox" data-check="${esc(i.id)}" ${i.done?'checked':''} ${busy?'disabled':''}><span>${esc(i.text)}</span></label>`;$('#listitems').innerHTML=items.length?pending.map(row).join('')+(done.length?'<h2 class="done-title">Done</h2>'+done.map(row).join(''):''):'<div class="empty">Nothing on the list yet.</div>';$('#listitems').querySelectorAll('[data-check]').forEach(box=>box.onchange=()=>{const id=box.dataset.check,wanted=box.checked;changeChecklist(key,items=>{const item=items.find(i=>i.id===id);if(item){item.done=wanted;item.completedAt=wanted?new Date().toISOString():null}})});}
async function changeChecklist(key,apply){if(busy)return false;busy=true;const form=$('#listform'),submit=form?.querySelector('button');if(submit)submit.disabled=true;if($('#listsync'))$('#listsync').textContent='Saving…';renderChecklistItems();let success=false;try{for(let attempt=0;attempt<3;attempt++){const read=await FamilyAuth.request('/api/state');const current=await read.json();if(!read.ok)throw Error(current.error||'Unable to load list');const next=structuredClone(current.data);next.lists=next.lists||{};next.lists[key]=Array.isArray(next.lists[key])?next.lists[key]:[];apply(next.lists[key]);const written=await FamilyAuth.request('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:next,version:current.version})});const result=await written.json();if(written.status===409&&attempt<2)continue;if(!written.ok)throw Error(result.error||'Unable to save. Please try again.');data=normalize(result.data);version=result.version;market=current.market||market;notice('');success=true;break}}catch(e){notice(e.message||'Unable to save. Please try again.')}finally{busy=false;if(['market','todo'].includes(page)){renderChecklistItems();if($('#listsync'))$('#listsync').textContent=success?'Saved':'Not saved';const currentSubmit=$('#listform')?.querySelector('button');if(currentSubmit)currentSubmit.disabled=false}}return success}
async function refreshChecklist(){if(!data||busy||!['market','todo'].includes(page)||document.hidden||!$('#listitems'))return;const currentPage=page;try{const r=await FamilyAuth.request('/api/state');if(!r.ok)return;const latest=await r.json();if(page!==currentPage||busy)return;if(latest.version!==version){data=normalize(latest.data);version=latest.version;market=latest.market||market;renderChecklistItems()}if($('#listsync'))$('#listsync').textContent='Up to date'}catch{if($('#listsync'))$('#listsync').textContent='Offline · retrying'}}
setInterval(refreshChecklist,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshChecklist()});

FamilyAuth.boot(load);
</script><script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))</script></html>
